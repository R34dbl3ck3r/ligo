name: PR - Smoke

# Objetivo: dar feedback al autor del Pull Request en menos de ~10 minutos.
# Sólo se ejecuta lo que puede bloquear un merge: calidad estática + los
# escenarios @smoke de Web y API (los P0 del camino crítico).
# La suite completa y Mobile se dejan para merge y nightly (ver docs/05).

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Un push nuevo cancela la ejecución anterior del mismo PR: ahorra minutos de CI.
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://www.saucedemo.com
  BOOKER_BASE_URL: https://restful-booker.herokuapp.com

jobs:
  static-analysis:
    name: Type check (web + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - name: Instalar dependencias (web)
        working-directory: web
        run: npm ci
      - name: Type check (web)
        working-directory: web
        run: npm run typecheck
      - name: Instalar dependencias (mobile)
        working-directory: mobile
        run: npm ci
      - name: Type check (mobile)
        working-directory: mobile
        run: npm run typecheck

  web-smoke:
    name: Web @smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: Instalar navegador
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Ejecutar smoke
        working-directory: web
        run: npm run test:smoke -- --project=chromium
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: |
            web/reports/html
            web/reports/junit
          retention-days: 7

  api-smoke:
    name: API @smoke (Karate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Health check del entorno
        # Si el servicio público no responde, se falla rápido y con un mensaje
        # claro en lugar de acumular fallos que no son del producto.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BOOKER_BASE_URL/ping" || echo 000)
          echo "GET /ping -> $code"
          if [ "$code" != "201" ]; then
            echo "::warning::El entorno de Restful Booker no respondió (código $code)"
          fi
      - name: Ejecutar smoke
        working-directory: api
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: mvn -B test -Dkarate.options="--tags @smoke" -Dbooker.baseUrl=$BOOKER_BASE_URL
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-report
          path: api/target/karate-reports
          retention-days: 7
