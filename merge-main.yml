name: Merge - Regression

# Objetivo: verificar que lo integrado en main no rompe nada.
# Se ejecuta la regresión completa de Web y API (todas las prioridades),
# con reintento en CI para absorber inestabilidad puntual de los entornos
# públicos, y se publica el reporte como artefacto y como resumen del job.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: https://www.saucedemo.com
  BOOKER_BASE_URL: https://restful-booker.herokuapp.com

jobs:
  web-regression:
    name: Web @regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Regresión completa
        working-directory: web
        run: npm run test:regression -- --project=chromium
      - name: Resumen en el job
        if: always()
        working-directory: web
        run: |
          echo "### Resultado Web" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/junit/results.xml ]; then
            python3 scripts/junit-summary.py reports/junit/results.xml >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No se generó el reporte JUnit" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-regression-report
          path: |
            web/reports/html
            web/reports/artifacts
          retention-days: 15

  api-regression:
    name: API completa (Karate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Suite completa
        working-directory: api
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: mvn -B test -Dbooker.baseUrl=$BOOKER_BASE_URL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-regression-report
          path: api/target/karate-reports
          retention-days: 15
